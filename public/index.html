<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#dc3545" />
  <title>GeoShield — Report an Incident</title>
  <link rel="manifest" href="/manifest.json" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <span class="brand">Geo<span>Shield</span></span>
  <div style="display:flex;gap:0.75rem;align-items:center;">
    <span id="offline-badge">📡 OFFLINE</span>
    <span id="queue-badge" style="display:none;background:#fd7e14;color:#000;font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:99px;"></span>
    <a href="/admin.html" style="color:#aaa;font-size:0.82rem;text-decoration:none;">Admin →</a>
  </div>
</nav>

<!-- Full-screen map -->
<div id="map"></div>

<!-- Report Panel -->
<div id="report-panel">
  <h5>📍 Drop a pin to report an incident</h5>
  <p id="pin-hint" style="font-size:0.82rem;color:#888;margin-bottom:0.75rem;">
    Tap anywhere on the map to set your incident location.
  </p>

  <div id="report-form" style="display:none;">
    <div class="mb-2">
      <label class="form-label">Location</label>
      <input type="text" id="coords-display" class="form-control" readonly
             style="font-size:0.78rem;color:#6c757d;" placeholder="Click map to set location" />
    </div>

    <div class="mb-2">
      <label class="form-label">Category</label>
      <select id="category" class="form-select">
        <option value="flood">🌊 Flood / Waterlogging</option>
        <option value="fire">🔥 Fire</option>
        <option value="medical">🚑 Medical Emergency</option>
        <option value="structural_collapse">🏚️ Structural Collapse</option>
        <option value="road_accident">🚗 Road Accident</option>
        <option value="other">⚠️ Other</option>
      </select>
    </div>

    <div class="mb-2">
      <label class="form-label">Severity</label>
      <div class="severity-row">
        <input type="range" id="severity" min="1" max="5" value="3" />
        <span class="severity-label" id="severity-value">3</span>
        <span style="font-size:0.78rem;color:#888;" id="severity-text">Moderate</span>
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label">Description <span style="color:#555">(optional)</span></label>
      <textarea id="description" class="form-control" rows="2"
                placeholder="Brief description of the situation…" maxlength="500"></textarea>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="submitReport()">
      🚨 Submit Distress Signal
    </button>
    <button onclick="cancelPin()"
            style="width:100%;background:transparent;border:1px solid rgba(255,255,255,0.1);
                   color:#888;border-radius:8px;padding:0.4rem;margin-top:0.4rem;cursor:pointer;font-size:0.82rem;">
      Cancel
    </button>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/offlineQueue.js"></script>
<script src="/js/register-sw.js"></script>
<script src="/js/citizen.js"></script>

</body>
</html>
