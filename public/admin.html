<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoShield — Command Center</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    /* Admin-specific overrides */
    #map { right: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); }

    .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #555;
      margin: 0.75rem 0 0.4rem;
      font-weight: 600;
    }

    .filter-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: rgba(13,110,253,0.2);
      border-color: #0d6efd;
      color: #fff;
    }

    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #28a745;
      animation: pulse-dot 1.5s ease-in-out infinite;
      margin-right: 6px;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .incident-meta {
      color: #666;
      font-size: 0.72rem;
      margin-top: 2px;
    }

    #incident-list { max-height: 40vh; overflow-y: auto; display:flex; flex-direction:column; gap:0.4rem; }
    #cluster-list  { max-height: 18vh; overflow-y: auto; display:flex; flex-direction:column; gap:0.4rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <span class="brand">Geo<span>Shield</span> <span style="font-size:0.7rem;color:#666;font-weight:400;">Command Center</span></span>
  <div style="display:flex;gap:0.6rem;align-items:center;">
    <span class="live-dot"></span>
    <span style="font-size:0.78rem;color:#888;" id="conn-status">Connecting…</span>
    <a href="/index.html" style="color:#aaa;font-size:0.82rem;text-decoration:none;">← Citizen App</a>
  </div>
</nav>

<!-- Full-screen map (shifted left to make room for sidebar) -->
<div id="map"></div>

<!-- Admin Sidebar -->
<div id="sidebar">

  <!-- Stats row -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
    <div class="stat-card">
      <h6>Active</h6>
      <div class="stat-value" id="stat-active">—</div>
    </div>
    <div class="stat-card">
      <h6>Critical</h6>
      <div class="stat-value" style="color:var(--color-critical);" id="stat-critical">—</div>
    </div>
    <div class="stat-card">
      <h6>Responders</h6>
      <div class="stat-value" style="color:#0d6efd;" id="stat-responders">—</div>
    </div>
    <div class="stat-card">
      <h6>Resolved</h6>
      <div class="stat-value" style="color:#6c757d;" id="stat-resolved">—</div>
    </div>
  </div>

  <!-- Filter row -->
  <div>
    <div class="section-title">Filter by Status</div>
    <div class="filter-row" id="filter-row">
      <button class="filter-btn active" data-status="">All</button>
      <button class="filter-btn" data-status="NEW">New</button>
      <button class="filter-btn" data-status="VERIFIED">Verified</button>
      <button class="filter-btn" data-status="ASSIGNED">Assigned</button>
    </div>
  </div>

  <!-- Cluster analysis -->
  <div>
    <div class="section-title">Incident Clusters (5 km radius)</div>
    <div id="cluster-list">
      <div style="color:#555;font-size:0.8rem;">Click a point on the map to analyse…</div>
    </div>
  </div>

  <!-- Incident list -->
  <div style="flex:1;min-height:0;">
    <div class="section-title">Recent Incidents</div>
    <div id="incident-list">
      <div style="color:#555;font-size:0.8rem;">Loading…</div>
    </div>
  </div>

</div>

<!-- Assign responder modal (minimal) -->
<div id="assign-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9000;align-items:center;justify-content:center;">
  <div style="background:#1a1d27;border-radius:14px;padding:1.5rem;width:min(400px,90vw);border:1px solid rgba(255,255,255,0.1);">
    <h6 style="margin:0 0 1rem;color:#fff;">Assign Nearest Responder</h6>
    <div id="nearest-responders-list" style="display:flex;flex-direction:column;gap:0.5rem;max-height:260px;overflow-y:auto;"></div>
    <button onclick="closeAssignModal()"
            style="width:100%;margin-top:1rem;background:transparent;border:1px solid rgba(255,255,255,0.1);
                   color:#888;border-radius:8px;padding:0.4rem;cursor:pointer;">
      Cancel
    </button>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/js/admin.js"></script>

</body>
</html>
