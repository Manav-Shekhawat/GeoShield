name: GeoShield CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          echo "Checking syntax across server/ and public/js/..."
          find server public/js tests -name "*.js" -exec node --check {} +
          echo "✅ All JavaScript files passed syntax verification."

      - name: Run integration tests
        if: ${{ env.MONGODB_URI != '' }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm test
